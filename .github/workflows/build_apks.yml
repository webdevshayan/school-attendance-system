name: Build APKs

on:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/build_apks.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build_apks.yml"
  workflow_dispatch:

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_admin:
    name: Admin app APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # libsql_dart ships a Rust core through Dart native assets; the
      # toolchain must exist before pub get / test / build touch it.
      # NOTE: rustup's armv7 android target is "armv7-linux-androideabi"
      # (no "a"), unlike the NDK triple.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # No-op on recent stables where native assets are already the default.
      - name: Enable Dart native assets
        run: flutter config --enable-native-assets || echo "flag absent - native assets likely default"

      # Platform folders are generated at build time so the repo stays light.
      - name: Generate Android platform scaffold
        run: flutter create . --platforms android --org dev.shayan --project-name admin_app

      # The generated manifest lacks the runtime permissions the door app
      # needs, and tflite_flutter mixes Java targets (harmless: keep it at
      # warning level instead of failing the gradle build).
      - name: Patch Android scaffold
        run: |
          python3 - <<'PY'
          manifest = 'android/app/src/main/AndroidManifest.xml'
          s = open(manifest).read()
          wanted = ['android.permission.CAMERA', 'android.permission.INTERNET']
          missing = [p for p in wanted if p not in s]
          if missing:
              insert = '\n'.join(
                  f'    <uses-permission android:name="{p}" />' for p in missing
              )
              s = s.replace('    <application', insert + '\n\n    <application', 1)
              open(manifest, 'w').write(s)
              print('added permissions:', missing)
          else:
              print('permissions already present')
          props = 'android/gradle.properties'
          g = open(props).read()
          if 'kotlin.jvm.target.validation.mode' not in g:
              with open(props, 'a') as f:
                  f.write('\nkotlin.jvm.target.validation.mode=warning\n')
              print('gradle.properties: jvm target validation -> warning')
          if 'shrink=false' not in g:
              # INCIDENT 2026-11-21 (door device): every face capture threw
              # "PlatformException ... Object.getClass() on a null object
              # reference" - deterministically, in the release APK only.
              # Since Flutter 3.44+ the Flutter Gradle plugin turns R8
              # minification ON for release builds by default
              # (FlutterPlugin.kt: shouldShrinkResources() defaults to true),
              # and ML Kit's internals do not survive it: the shipped APK's
              # classes.dex carried the r8-map-id and Laa0;-style renamed
              # classes, and the stripped ML Kit codegen NPE'd on every
              # detection. `shrink=false` is the plugin's official opt-out;
              # the size win on a ~227 MB APK is marginal anyway.
              with open(props, 'a') as f:
                  f.write('\nshrink=false\n')
              print('gradle.properties: shrink=false (release builds stay unminified)')
          root = 'android/build.gradle.kts'
          r = open(root).read()
          if 'lint tasks disabled repo-wide' not in r:
              # AGP lint crashes (JavaDocParser NoSuchMethodError) while
              # running lintVital over flutter plugin sources
              # (camera_android_camerax). The Phase 2 quality gate is dart
              # analyze + unit tests + gradle compilation, so disable the lint
              # tasks at task level (DSL-level lint{} does not reliably reach
              # flutter plugin library modules).
              r = r + '''

          // Lint tasks disabled repo-wide: AGP lint crashes while analyzing
          // flutter plugin sources. See the workflow scaffold-patch comment.
          gradle.projectsEvaluated {
              subprojects {
                  tasks.matching { it.name.startsWith("lint") }.configureEach {
                      enabled = false
                  }
              }
          }
          '''
              open(root, 'w').write(r)
              print('build.gradle.kts: lint tasks disabled for all modules')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      # Flutter stable >=3.47 emits an info-level deprecation for
      # package:flutter/material.dart (superseded by material_ui); infos are
      # fatal by default on current stable. Keep errors/warnings fatal, let
      # that known info pass until the Phase 2/3 material_ui migration.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run smoke tests
        run: flutter test

      - name: Build release APK
        env:
          SYNC_SIGNING_SECRET: ${{ secrets.SYNC_SIGNING_SECRET }}
        run: |
          # The HMAC secret is injected at compile time (never committed).
          # Without it the APK still builds and runs fully offline - sync
          # stays disabled until a signed build is produced.
          args=(--release)
          if [ -n "$SYNC_SIGNING_SECRET" ]; then
            args+=(--dart-define=SYNC_SIGNING_SECRET="$SYNC_SIGNING_SECRET")
          else
            echo "::warning::SYNC_SIGNING_SECRET Actions secret is not set - building with sync disabled"
          fi
          flutter build apk "${args[@]}"

      # Storage rule: artifacts live for 1 day only, then vanish. The copy
      # renames the APK because both jobs produce app-release.apk - distinct
      # names let the release job merge-multiple-download without collision.
      - name: Stage APK for upload
        run: cp build/app/outputs/flutter-apk/app-release.apk admin-app.apk

      - name: Upload APK (retention 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: apps/admin/admin-app.apk
          if-no-files-found: error
          retention-days: 1

  build_parent:
    name: Parent app APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/parent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create . --platforms android --org dev.shayan --project-name parent_app

      - name: Resolve dependencies
        run: flutter pub get

      # See the note on the admin job's Analyze step.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run smoke tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK for upload
        run: cp build/app/outputs/flutter-apk/app-release.apk parent-app.apk

      - name: Upload APK (retention 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-apk
          path: apps/parent/parent-app.apk
          if-no-files-found: error
          retention-days: 1

  # Belt-and-suspenders storage cleanup: purge any artifact older than 24h,
  # even if it leaked from another run or branch.
  purge_stale_artifacts:
    name: Purge artifacts older than 1 day
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build_admin, build_parent]
    permissions:
      actions: write
    steps:
      - name: Delete stale artifacts via the API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --paginate --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id")
          if [ -z "$ids" ]; then
            echo "No artifacts older than 1 day. Nothing to purge."
          else
            for id in $ids; do
              echo "Purging artifact $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done
          fi

  # Persistent deliverable: every change that reaches main produces a GitHub
  # Release carrying both APKs. Release assets never expire - the 1-day
  # artifacts above stay a PR-review convenience only. PR runs never release;
  # manual dispatches release only when run on main.
  release_apks:
    name: Release APKs (GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_admin, build_parent]
    if: >-
      always() &&
      needs.build_admin.result == 'success' &&
      needs.build_parent.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download the built APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-app-apk"
          merge-multiple: true

      - name: Create the release with both APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date -u +%Y%m%d)-run${{ github.run_number }}"
          SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "Release APKs built from commit \`${GITHUB_SHA::7}\`."
            echo
            echo "- **admin-app.apk** - door-side app: face recognition, offline attendance queue, pairing-code minting. Built with the signing secret (sync enabled)."
            echo "- **parent-app.apk** - guardian app: code pairing + live attendance feed."
            echo
            echo "Change: $SUBJECT"
            echo
            echo "Built by [run ${{ github.run_number }}](${{ github.server_url }}/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC')."
          } > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "APKs - $(date -u '+%Y-%m-%d') (run ${{ github.run_number }})" \
            --notes-file notes.md \
            dist/admin-app.apk dist/parent-app.apk
          echo "Release $TAG created with both APKs"

name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy_server.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/deploy_server.yml"

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR gate: unit tests + vet + gofmt run before any server change can merge.
  # Merges to main go straight to the deploy job (they were reviewed + green
  # on the PR).
  test:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt (fail on unformatted files)
        working-directory: server
        run: |
          unformatted=$(gofmt -l api cmd pkg index.go main.go smoke)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files: $unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./pkg/... -count=1

  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Fail loudly with a pointer to the fix instead of a cryptic vercel error.
      - name: Guard required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v' - add it under Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # INCIDENT 2026-11-20 (PR #6): the "Go" framework preset (slug "go")
      # BUILDS index.go successfully with @vercel/go, but the resulting
      # catch-all function fails at invocation (FUNCTION_INVOCATION_FAILED on
      # every route) for this root-package layout, taking production down.
      # Until that is root-caused (needs the function's runtime logs), the
      # preset stays "Other": the per-file api/*.go module mode that has been
      # serving production since Phase 2. index.go/main.go/cmd/server stay in
      # the tree for the retry. The deploy step verifies health after every
      # deploy so a runtime-broken build can never silently go live again.
      - name: Ensure framework preset is Other (self-heal, post-incident)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          patch_project() {
            curl -sS -o /tmp/vercel_project.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "$1" -d '{"framework": null}'
          }
          code=$(patch_project "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$code" != 200 ]; then
            echo "teamId attempt -> HTTP $code, retrying without team scope"
            code=$(patch_project "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          fi
          if [ "$code" = 200 ]; then
            echo "Framework preset ensured (Go)."
          else
            echo "::error::Could not set the framework preset to Go (HTTP $code). Flip it manually: Vercel dashboard -> rgs-attendance-system -> Settings -> Build & Output Settings -> Framework Preset -> Go, then re-run this workflow."
            exit 1
          fi

      # The runtime env lives on the Vercel project, not in Actions - so the
      # credentials kept in repo secrets are pushed into Vercel (production)
      # before every deploy. Rotating a secret here propagates on the next
      # run; the values are passed via flags/env, never printed.
      - name: Bridge Turso credentials into Vercel (production)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NITROPING_WEBHOOK_URL: ${{ secrets.NITROPING_WEBHOOK_URL }}
          NITROPING_API_KEY: ${{ secrets.NITROPING_API_KEY }}
        run: |
          sync_env() {
            name="$1"; val="$2"; required="$3"
            if [ -z "$val" ]; then
              if [ "$required" = "required" ]; then
                echo "::error::Missing repo secret '$name' - add it under Settings > Secrets and variables > Actions"
                missing=1
              else
                echo "optional $name not set in Actions secrets - skipping (push fan-out stays disabled)"
              fi
              return
            fi
            # Replace the production value so rotations propagate. A var that
            # does not exist yet (or a prompting CLI) is handled by || true.
            printf 'y\n' | npx --yes vercel@latest env rm "$name" production --yes >/dev/null 2>&1 || true
            npx --yes vercel@latest env add "$name" production --value "$val" >/dev/null
            echo "synced $name -> Vercel (production)"
          }
          missing=0
          sync_env TURSO_DATABASE_URL "$TURSO_DATABASE_URL" required
          sync_env TURSO_AUTH_TOKEN "$TURSO_AUTH_TOKEN" required
          sync_env NITROPING_WEBHOOK_URL "$NITROPING_WEBHOOK_URL" optional
          sync_env NITROPING_API_KEY "$NITROPING_API_KEY" optional
          exit $missing

      # Remote build (no pull/build/--prebuilt): Vercel compiles the Go
      # runtime on its own infra. After the swap, verify the deployment is
      # actually SERVABLE (PR #6 lesson: a build can succeed and still crash
      # at invocation - health verification is what catches that).
      - name: Deploy server/ to Vercel (production, remote build)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy --prod || { echo "::error::Vercel deploy failed"; exit 1; }
          echo "Deploy accepted. Verifying production health..."
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "https://rgs-attendance-system.vercel.app/api/health" || echo 000)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json 2>/dev/null; then
              echo "Production healthy (attempt $attempt): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "health check $attempt -> HTTP $code $(cat /tmp/health.json 2>/dev/null); retrying in 15 s"
            sleep 15
          done
          echo "::error::Production is not healthy after the deploy - see the function logs in the Vercel dashboard"
          exit 1

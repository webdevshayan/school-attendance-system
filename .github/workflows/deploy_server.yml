name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy_server.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/deploy_server.yml"

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR gate: unit tests + vet + gofmt run before any server change can merge.
  # Merges to main go straight to the deploy job (they were reviewed + green
  # on the PR).
  test:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt (fail on unformatted files)
        working-directory: server
        run: |
          unformatted=$(gofmt -l api pkg main.go smoke)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files: $unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./pkg/... -count=1

  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Fail loudly with a pointer to the fix instead of a cryptic vercel error.
      - name: Guard required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SYNC_SIGNING_SECRET: ${{ secrets.SYNC_SIGNING_SECRET }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN SYNC_SIGNING_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v' - add it under Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runtime env lives on the Vercel project, not in Actions - so the
      # credentials kept in repo secrets are pushed into Vercel before every
      # deploy, for BOTH the production and preview targets: the preview
      # verification below then runs with the same credentials production
      # will get (full-fidelity gate, not a degraded one). Rotating a secret
      # here propagates on the next run; values are passed via flags, never
      # printed.
      - name: Bridge credentials into Vercel (production + preview)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SYNC_SIGNING_SECRET: ${{ secrets.SYNC_SIGNING_SECRET }}
          NITROPING_WEBHOOK_URL: ${{ secrets.NITROPING_WEBHOOK_URL }}
          NITROPING_API_KEY: ${{ secrets.NITROPING_API_KEY }}
        run: |
          sync_env() {
            name="$1"; val="$2"; required="$3"
            for target in production preview; do
              if [ -z "$val" ]; then
                if [ "$required" = "required" ]; then
                  echo "::error::Missing repo secret '$name' - add it under Settings > Secrets and variables > Actions"
                  missing=1
                else
                  echo "optional $name not set in Actions secrets - skipping ($target; push fan-out stays disabled)"
                fi
                continue
              fi
              printf 'y\n' | npx --yes vercel@latest env rm "$name" "$target" --yes >/dev/null 2>&1 || true
              # Empty line answers the CLI's "git branches" prompt for preview
              # env vars (run 44856649534: with no TTY the prompt swallowed
              # the add and preview deployments lost every variable).
              if printf '\n' | npx --yes vercel@latest env add "$name" "$target" --value "$val" >/dev/null 2>&1; then
                echo "synced $name -> Vercel ($target)"
              else
                if [ "$target" = "production" ]; then
                  echo "::error::could not sync '$name' to Vercel production"
                  missing=1
                else
                  echo "::warning::could not sync '$name' to Vercel preview - the gate treats preview env as best-effort"
                fi
              fi
            done
          }
          missing=0
          sync_env TURSO_DATABASE_URL "$TURSO_DATABASE_URL" required
          sync_env TURSO_AUTH_TOKEN "$TURSO_AUTH_TOKEN" required
          sync_env SYNC_SIGNING_SECRET "$SYNC_SIGNING_SECRET" required
          sync_env NITROPING_WEBHOOK_URL "$NITROPING_WEBHOOK_URL" optional
          sync_env NITROPING_API_KEY "$NITROPING_API_KEY" optional
          exit $missing

      # INCIDENT CLASS CLOSED 2026-11-21. Three production failures shared one
      # root cause: production was swapped BEFORE anyone knew the build could
      # actually run.
      #   - "No Go entrypoint found"     (preset "Go", no main.go in the tree)
      #   - FUNCTION_INVOCATION_FAILED   (preset "Go", package-handler main.go)
      #   - "fork/exec ./user-server:    (preset "Go", package-handler main.go,
      #     exec format error"            dashboard redeploy)
      # The entrypoint is now a real package-main server on PORT (de23c65, per
      # docs/functions/runtimes/go), and this pipeline is VERIFY-THEN-PROMOTE:
      # every deployment is built on a preview URL first, verified against
      # /api/health with the real credentials, and only a VERIFIED deployment
      # is promoted to production. An unverifiable Go-framework build
      # automatically falls back to preset "Other" (api/*.go) - still
      # verify-then-promote. Production is never touched by an unverified
      # build; if production were ever unhealthy after a promote, the job
      # rolls back to the previous production deployment and fails loudly.
      - name: Deploy, verify on preview, promote (zero-downtime)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PROD_URL="https://rgs-attendance-system.vercel.app"

          set_framework() {
            if [ "$1" = "go" ]; then body='{"framework": "go"}'; else body='{"framework": null}'; fi
            code=$(curl -sS -o /tmp/vercel_project.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              -d "$body")
            if [ "$code" != 200 ]; then
              code=$(curl -sS -o /tmp/vercel_project.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
                -d "$body")
            fi
            if [ "$code" != 200 ]; then
              echo "::error::Could not set the framework preset (HTTP $code)"
              exit 1
            fi
            echo "framework preset set: $1"
          }

          deploy_preview() {
            if ! npx --yes vercel@latest deploy >/tmp/deploy.log 2>&1; then
              echo "::error::vercel deploy failed - last lines:" >&2
              tail -20 /tmp/deploy.log >&2
              return 1
            fi
            tail -6 /tmp/deploy.log >&2
            url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/deploy.log | grep -v 'rgs-attendance-system\.vercel\.app' | tail -1)
            if [ -z "$url" ]; then
              echo "::error::could not parse the preview deployment URL from the deploy output" >&2
              return 1
            fi
            echo "$url"
          }

          check_health() {
            base="$1"; mode="${2:-strict}"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "$base/api/health" || echo 000)
              if [ "$code" = 200 ] && grep -q '"status":"ok"' /tmp/health.json; then
                if [ "$mode" = "loose" ] && ! grep -q '"turso":"configured"' /tmp/health.json; then
                  echo "healthy (attempt $attempt, runtime ok - preview env best-effort): $(cat /tmp/health.json)"
                  return 0
                fi
                if grep -q '"turso":"configured"' /tmp/health.json; then
                  echo "healthy (attempt $attempt, full fidelity): $(cat /tmp/health.json)"
                fi
                return 0
              fi
              echo "health check $attempt -> HTTP $code $(cat /tmp/health.json 2>/dev/null); retrying in 15 s"
              sleep 15
            done
            return 1
          }

          # Preview deployments sit behind "Vercel Authentication" (SSO) by
          # default, which 302-redirects the unauthenticated health probe (run
          # 44855664515: every gate check hit "HTTP 302 Protected by Vercel
          # Authentication"). Protection Bypass for Automation has no REST
          # endpoint to create secrets, so the pipeline clears the SSO toggle
          # (PATCH ssoProtection: null) for the verification window - previews
          # become briefly public, and every endpoint except /api/health is
          # authenticated anyway - and restores it on step exit via trap.
          restore_sso() {
            curl -sS -o /dev/null -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              -d '{"ssoProtection": {"deploymentType": "preview"}}' >/dev/null 2>&1 || true
          }
          disable_sso() {
            code=$(curl -sS -o /tmp/sso.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              -d '{"ssoProtection": null}')
            if [ "$code" != 200 ]; then
              echo "::warning::could not clear SSO protection (HTTP $code) - the preview gate may see 302 redirects"
            else
              echo "preview SSO protection cleared for the verification window"
            fi
          }
          disable_sso
          trap restore_sso EXIT

          echo '--- attempt 1: framework preset "go" - one package-main server (de23c65 entrypoint) ---'
          set_framework go
          URL=$(deploy_preview) || exit 1
          if ! check_health "$URL" loose; then
            echo "::warning::Go-framework build failed verification - falling back to preset Other (api/*.go per-file functions)"
            echo '--- attempt 2: framework preset "Other" - proven serverless shape ---'
            set_framework null
            URL=$(deploy_preview) || exit 1
            if ! check_health "$URL" loose; then
              echo "::error::even the fallback failed verification - production left untouched"
              exit 1
            fi
          fi

          echo "verified on preview: $URL - promoting to production"
          if ! npx --yes vercel@latest promote "$URL" --yes; then
            echo "::error::promote failed - production keeps running the previous deployment"
            exit 1
          fi

          if ! check_health "$PROD_URL"; then
            echo "::warning::production health failed after promote - rolling back"
            npx --yes vercel@latest rollback --yes || echo "::warning::automatic rollback failed - roll back in the Vercel dashboard (Deployments -> previous production -> Promote/Rollback)"
            echo "::error::production was not healthy after promote - rolled back"
            exit 1
          fi
          echo "PRODUCTION LIVE AND HEALTHY - promoted $URL"

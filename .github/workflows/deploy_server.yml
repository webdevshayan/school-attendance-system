name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy_server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Fail loudly with a pointer to the fix instead of a cryptic vercel error.
      - name: Guard required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v' - add it under Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The remote build requires Framework Preset "Other": the server is
      # serverless functions in api/, built by Vercel's Go runtime - there is
      # no main.go. A Golang app preset fails with "No Go entrypoint found".
      # Heal the project setting via the API so an accidental preset flip in
      # the dashboard can't break deploys. The token is used in-place, never
      # printed.
      - name: Ensure framework preset is Other (self-heal)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          patch_project() {
            curl -sS -o /tmp/vercel_project.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "$1" -d '{"framework": null}'
          }
          code=$(patch_project "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$code" != 200 ]; then
            echo "teamId attempt -> HTTP $code, retrying without team scope"
            code=$(patch_project "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          fi
          if [ "$code" = 200 ]; then
            echo "Framework preset ensured (Other)."
          else
            echo "::error::Could not set the framework preset to Other (HTTP $code). Flip it manually: Vercel dashboard -> rgs-attendance-system -> Settings -> Build & Output Settings -> Framework Preset -> Other, then re-run this workflow."
            exit 1
          fi

      - name: Deploy server/ to Vercel (production, remote build)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID come from the env
          # block above; the CLI picks them up without --token on the command
          # line. Remote build (no pull/build/--prebuilt): Vercel compiles the
          # Go runtime on its own infra - the local prebuilt flow broke with
          # ENOENT on the built bootstrap binary (CLI 66.x quirk).
          npx --yes vercel@latest deploy --prod

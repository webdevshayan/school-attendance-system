name: admin_app
description: Door-side admin app for the school attendance system - on-device face recognition and offline-first attendance capture.
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  face_verification: ^0.3.9
  libsql_dart: ^0.9.0
  camera: ^0.12.2
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
